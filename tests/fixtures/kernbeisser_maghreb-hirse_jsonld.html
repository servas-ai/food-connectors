<script type="application/ld+json">{"@context":"https:\/\/schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Was kosten die Kernbei\u00dfer Produkte?","acceptedAnswer":{"@type":"Answer","text":"Ein Glas kostet 9\u20ac. Wir verkaufen ab einer Mindestbestellmenge von 6 Gl\u00e4sern (54\u20ac insgesamt).Unser Probierpaket mit allen 6 Gerichten kannst allerdings schon f\u00fcr 50\u20ac bestellen und dich durch alle Geschmacksrichtungen kosten!"}},{"@type":"Question","name":"Haben Kernbei\u00dfer Fertiggerichte Zusatzstoffe?","acceptedAnswer":{"@type":"Answer","text":"Kernbei\u00dfer Gerichte haben keine Zusatzstoffe. Das bedeutet, sie werden nicht mit Aromen und Geschmacksverst\u00e4rker versetzt. Au\u00dferdem werden kein zus\u00e4tzlicher Zucker und keine Konservierungsstoffe hinzugef\u00fcgt."}},{"@type":"Question","name":"Wie gro\u00df ist eine Portion?","acceptedAnswer":{"@type":"Answer","text":"Mit 450 g pro Glas stellen unsere Gerichte eine vollwertige Mahlzeit dar. Ein Glas enth\u00e4lt ein bis zwei Portionen."}},{"@type":"Question","name":"Sind Kernbei\u00dfer Fertiggerichte scharf?","acceptedAnswer":{"@type":"Answer","text":"Die Kernbei\u00dfer Fertiggerichte sind nicht pikant. Lediglich das Thai Naturreis und Maghreb Hirse Glas haben eine leichte Chilli Sch\u00e4rfe."}},{"@type":"Question","name":"Sind die Gerichte laktose- und glutenfrei?","acceptedAnswer":{"@type":"Answer","text":"Alle Kernbei\u00dfer Produkte sind vegan und somit laktosefrei.Bis auf das Heimat Hafer und Mediterran Roggen Glas, basieren alle anderen Kernbei\u00dfer Fertiggerichte auf Getreidesorten, die von Natur aus kein Gluten beinhalten. Darunter Naturreis, Quinoa, Hirse und Buchweizen."}},{"@type":"Question","name":"Muss man Kernbei\u00dfer Gerichte aufw\u00e4rmen?","acceptedAnswer":{"@type":"Answer","text":"Man kann die Fertiggerichte kurz im Topf\/Pfanne (evtl. mit etwas Wasser) erw\u00e4rmen oder in der Mikrowelle ca. 3 Minuten erhitzen. Aber auch kalt (gleich aus dem Glas), sind die Maghreb Hirse, die Tex-Mex Quinoa, der Fr\u00fchst\u00fccks Buchweizen und der Mediterran Roggen sehr zu empfehlen. Insbesondere an den hei\u00dfen Sommertagen, w\u00e4hrend einer Wanderung oder wenn du einfach keine Zeit \/ M\u00f6glichkeit f\u00fcr das Aufw\u00e4rmen hast.\u00a0"}},{"@type":"Question","name":"Muss man etwas dazu kochen?","acceptedAnswer":{"@type":"Answer","text":"Kernbei\u00dfer Fertiggerichte sind komplette Mahlzeiten, die alle wichtigen N\u00e4hrstoffe einer Mahlzeit abdecken. Du musst dir also keine Lebensmittel mit vielen Kohlenhydraten oder Protein dazu vorbereiten. Nat\u00fcrlich darfst du das Gericht gerne mit einer kleinen Salatbeilage oder verschiedenen Toppings aufpeppen."}},{"@type":"Question","name":"Wie lange sind die Gerichte haltbar?","acceptedAnswer":{"@type":"Answer","text":"Unsere Gerichte sind ungek\u00fchlt mindestens ein Jahr lang haltbar, ohne jegliche Verwendung von Zusatzstoffen. Nach dem \u00d6ffnen sind die Gerichte noch mindestens 3 Tage im K\u00fchlschrank haltbar."}}]}</script>
